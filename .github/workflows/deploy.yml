name: Deploy to Cloudflare (kiroku)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip when the Cloudflare token is not set yet
        if: env.CLOUDFLARE_API_TOKEN == '' && github.event_name == 'push'
        run: echo "CLOUDFLARE_API_TOKEN is not set in the repository secrets; skipping deploy."
      - name: Stop a manual run when the Cloudflare token is not set
        if: env.CLOUDFLARE_API_TOKEN == '' && github.event_name != 'push'
        run: |
          echo "::error::CLOUDFLARE_API_TOKEN が未登録です。Settings → Secrets and variables → Actions に登録してください。"
          exit 1
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 deploy
